[notice]
"hide_gpt-5.1-codex-max_migration_prompt" = true
hide_rate_limit_model_nudge = true

[notice.model_migrations]
"gpt-5.2" = "gpt-5.2-codex"
"gpt-5.3-codex" = "gpt-5.4"

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest", "--channel", "stable", "--headless", "--isolated", "--no-usage-statistics"]
env = { npm_config_cache = "/tmp/.npm" }
startup_timeout_ms = 60000

[mcp_servers.chrome-devtools.tools.take_snapshot]
approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.navigate_page]
approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.fill_form]
approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.click]
approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.get_network_request]
approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.evaluate_script]
approval_mode = "approve"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[features]
multi_agent = true

[agents.memory-cleaner]
description = "Memory maintenance specialist for IPEOS projects: clean, compact, and archive ai_memory/ directory so future sessions can resume fast. Never deletes without explicit user confirmation."
config_file = "agents/memory-cleaner.toml"

[agents.explorer]
description = "Technical Owner Agent (TOA) for IPEOS projects: repository discovery, architecture mapping, work item management, and repo memory maintenance. Runs preflight before any delegation, ensures resumability."
config_file = "agents/explorer.toml"

[agents.developer]
description = "Implementation specialist in the IPEOS multi-agent team: write code, fix bugs, run tests, and refactor within a clearly scoped work item. Delegates to manager when blocked or out of scope."
config_file = "agents/developer.toml"

[agents.devops-engineer]
description = "Infrastructure and delivery specialist in the IPEOS multi-agent team: Docker, CI/CD pipelines, environments, deployment configuration. Produces reliable, reproducible infrastructure changes with clear evidence."
config_file = "agents/devops-engineer.toml"

[agents.verifier]
description = "Lightweight verification specialist in the IPEOS multi-agent team: run test suite and lint commands, report PASS/FAIL/BLOCKED with evidence. Fast and cheap — does not analyze code or suggest fixes."
config_file = "agents/verifier.toml"

[agents.code-base-analyst]
description = "Repository stack analyst for IPEOS projects: infer the real technical stack from the codebase and produce a reusable STACK_SPEC.md so other agents understand how the project is built, run, tested, and constrained."
config_file = "agents/code-base-analyst.toml"

[agents.frontend-reviewer-analyst]
description = "Deep frontend auditor for IPEOS projects: UX, accessibility, runtime, and integration issues using chrome-devtools on a scoped URL or flow, produce a FRONTEND_REVIEW_REPORT.md with evidence."
config_file = "agents/frontend-reviewer-analyst.toml"

[agents.backend-reviewer-analyst]
description = "Deep backend engineering auditor for IPEOS projects: validate behavior, audit security/correctness/reliability/maintainability/tests on a scoped module or API surface, produce a BACKEND_REVIEW_REPORT.md with evidence."
config_file = "agents/backend-reviewer-analyst.toml"

[agents.solution-architect]
description = "Spécialiste en analyse de problèmes et conception de solutions dans l'équipe IPEOS. Classe chaque demande en mode QUICK ou DEEP, benchmark les pratiques, compare les options, et produit un plan d'action concret pour le developer. Ne code pas."
config_file = "agents/solution-architect.toml"

[agents.rules-curator]
description = "Spécialiste en analyse de problèmes et conception de solutions dans l'équipe IPEOS. Classe chaque demande en mode QUICK ou DEEP, benchmark les pratiques, compare les options, et produit un plan d'action concret pour le developer. Ne code pas."
config_file = "agents/rules-curator.toml"

[plugins."github@openai-curated"]
enabled = true
