model = "gpt-5.4"
model_reasoning_effort = "medium"
personality = "pragmatic"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[notice]
"hide_gpt-5.1-codex-max_migration_prompt" = true
hide_rate_limit_model_nudge = true

[notice.model_migrations]
"gpt-5.2" = "gpt-5.2-codex"
"gpt-5.3-codex" = "gpt-5.4"

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest", "--browser-url", "http://127.0.0.1:9222"]

[mcp_servers.chrome-devtools.tools.take_snapshot]
approval_mode = "approve"

[features]
multi_agent = true

# --- Generic / existing agents ---
[agents.memory-cleaner]
description = "Memory maintenance specialist. Compacts WORK_ITEMS.md and REPO_STATE.md, archives role notes for DONE work items older than 7 days, and proposes deletion of archives older than 7 days (always with user confirmation). Never touches active work items or core project files."
config_file = "agents/memory-cleaner.toml"

[agents.explorer]
description = "Default TOA (Technical Owner Agent). Handles repo discovery, architecture mapping, and all continuity artifacts: REPO_STATE.md, WORK_ITEMS.md, WI_COUNTER.lock, INDEX.md. Runs conditional preflight (skipped if REPO_STATE is fresh), closure checks, and memory archiving."
config_file = "agents/explorer.toml"

[agents.developer]
description = "Implementation specialist. Handles feature work, bug fixes, tests, and refactors within a clearly scoped work item. Reads REPO_STATE.md, AGENT.md, and STACK_SPEC.md before starting. Hard file budget: 30 files. Returns BLOCKED if scope is unclear."
config_file = "agents/developer.toml"

[agents.devops-engineer]
description = "Infrastructure and delivery specialist. Handles Docker, docker-compose, CI/CD pipelines, environment config, and deployment scripts. Hard file budget: 20 files. Never exposes secrets. Does not touch application source code."
config_file = "agents/devops-engineer.toml"

[agents.verifier]
description = "Lightweight post-implementation verifier. Reads test commands from REPO_STATE.md or AGENT.md, runs them exactly, and reports PASS / FAIL / BLOCKED with evidence. No code analysis, no suggestions. Hard budget: 3 files read. Uses gpt-5.1-codex-mini."
config_file = "agents/verifier.toml"

[agents.code-base-analyst]
description = "Stack inference specialist. Analyzes the repo to produce or update STACK_SPEC.md. Triggered only when stack_spec_hash changed or STACK_SPEC.md is missing/stale. Writes stack_spec_hash to REPO_STATE.md after every analysis. Evidence-driven, max 25 files."
config_file = "agents/code-base-analyst.toml"

[agents.frontend-reviewer-analyst]
description = "Deep frontend auditor using MCP chrome-devtools. Scoped to specific URLs and flows. Expensive — use only for high-risk changes or explicit review requests. Outputs FRONTEND_REVIEW_REPORT.md with numbered issues and severities."
config_file = "agents/frontend-reviewer-analyst.toml"

[agents.backend-reviewer-analyst]
description = "Deep backend auditor. Scoped to specific modules, services, or API surfaces. Expensive — use only for high-risk changes or explicit review requests. Outputs BACKEND_REVIEW_REPORT.md with numbered issues and severities."
config_file = "agents/backend-reviewer-analyst.toml"


[agents.solution-architect]
description = "Problem analysis and solution design specialist. Classifies requests as QUICK or DEEP, benchmarks best practices, evaluates options, and produces a clear actionable plan for the developer. Does not write code. Outputs SOLUTION_PLAN__<WI-ID>.md for DEEP mode."
config_file = "agents/solution-architect.toml"

# --- Flutter agents ---
[agents.flutter-analyst]
description = "Flutter analyst (stack + architecture): infers Flutter/Dart/tooling/platform setup with evidence and produces FLUTTER_STACK_SPEC.md + FLUTTER_ARCH_REVIEW.md. Flags risks (state mgmt, navigation, error handling, perf, testability) and asks targeted questions when uncertain."
config_file = "agents/flutter-analyst.toml"

[agents.flutter-developer]
description = "Flutter developer: implements features/fixes with production-ready Flutter/Dart code aligned with repo conventions (state mgmt, navigation, DI, networking, persistence, i18n, accessibility). Prefers patch/diff output and includes run/test verification steps."
config_file = "agents/flutter-developer.toml"

[agents.flutter-reviewer-analyst]
description = "Flutter reviewer: deep code review/audit for correctness, async safety, architecture fit, performance, accessibility, and testing discipline. Produces FLUTTER_REVIEW_REPORT.md with evidence and actionable fixes."
config_file = "agents/flutter-reviewer-analyst.toml"

[plugins."github@openai-curated"]
enabled = true